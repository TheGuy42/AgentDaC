model:
    base_model: Qwen/Qwen3-14B
    tool_parser: null
    reasoning_parser: null
    internal_config:
        init_args:
            load_in_4bit: false
            gpu_memory_utilization: 0.75
            max_lora_rank: 16
        engine_args:
            max_model_len: 14336
            gpu_memory_utilization: 0.75
            max_lora_rank: 16
        peft_args:
            r: 16
    openai_config:
        server_args:
            chat_template: /home/fre.gilad/source/AgentDac-AGL/AgentDaC/config_files/templates/Qwen3.jinja
train:
    epochs: 3000
    num_groups: 8
    group_size: 8
    val_log_steps: 10
    delete_checkpoints: true
    checkpoint_metric: reward
    max_exceptions: 5
    verbose: false
    train_params:
        learning_rate: 5.0e-05
        kl_penalty_coef: 0.02
