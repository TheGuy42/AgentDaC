model:
    base_model: Qwen/Qwen3-0.6B
    tool_parser: null
    reasoning_parser: null
    internal_config:
        init_args:
            load_in_4bit: false
            gpu_memory_utilization: 0.5
            max_lora_rank: 16
        engine_args:
            max_model_len: 1024
            gpu_memory_utilization: 0.5
            max_lora_rank: 16
        peft_args:
            r: 16
    openai_config:
        server_args:
            chat_template: config_files/templates/Qwen3.jinja
train:
    epochs: 30
    num_groups: 8
    group_size: 8
    val_log_steps: 30
    train_episodes: true
    delete_checkpoints: true
    checkpoint_metric: reward
    max_exceptions: 0
    verbose: false
    train_params:
        learning_rate: 5.0e-05
        kl_penalty_coef: 0.0
