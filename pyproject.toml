[project]
name = "agentdac"
version = "0.6.0"
description = "DAC Agents with RL"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "json-repair>=0.59.10",
    "wrapt-timeout-decorator>=1.5.1",
    "jupyter>=1.1.1",
    "math-verify>=0.9.0",
    "datasets==4.3.0", # otherwise there is a dependency conflict with pyarrow    "transformers>=4.56.0,<5",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchaudio==2.10.0",
    "vllm==0.18.1",
    "verl==0.8.0",
    "chess>=1.11.2",
    "transferqueue>=0.1.8",
    "trl>=1.6.0",
    "transformers>=4.57.6",
    "huggingface-hub[cli]>=0.36.2",
]

# VERL 0.8.0 requires numpy<2 but its over-conservative
# Its own docker image uses vllm 0.20.x which requires numpy>=2
# So we override the dependency here to allow the installation.
[tool.uv]
override-dependencies = ["numpy>=2"] 

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

# Makes FlashAttention's installer see the exact runtime PyTorch build.
# This is useful both for selecting a prebuilt wheel and for compilation.
[tool.uv.extra-build-dependencies]
flash-attn = [
    { requirement = "torch", match-runtime = true },
]

# Install trl without any of its dependencies
# since we only need trl/chat_template_utils.py
[[tool.uv.dependency-metadata]]
name = "trl"
requires-dist = []
