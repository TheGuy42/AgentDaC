[project]
name = "agentdac"
version = "0.5.0"
description = "DAC Agents with RL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentlightning>=0.3.0",
    "json-repair>=0.59.10",
    "wrapt-timeout-decorator>=1.5.1",
    "jupyter>=1.1.1",
    "math-verify>=0.9.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "flash-attn",
    "vllm==0.11.0",
    "verl==0.6.1",
    "datasets==4.3.0", # otherwise there is a dependency conflict with pyarrow
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
no-build-isolation-package = ["flash-attn"]
